spring:
  application:
    name: helpdesk-api
    
  datasource:
    url: jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
    
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

application:
  security:
    jwt:
      secret-key: CLAVE_SECRETA_SUPER_SEGURA_DE_256_BITS_PARA_EL_SISTEMA_HELPDESK_EMPRESARIAL_2026
      expiration: 86400000 # 24 horas en milisegundos

server:
  port: 8080
